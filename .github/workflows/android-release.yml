name: Android CI & signed release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUILD_TOOLS: "36.0.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK Platform 36 and build-tools
        run: sdkmanager --install "platforms;android-36" "build-tools;${BUILD_TOOLS}" "platform-tools"

      - name: Set up Gradle (uses the committed wrapper)
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Debug build (no release credentials needed)
        run: ./gradlew --no-daemon assembleDebug

      - name: Release lint
        run: ./gradlew --no-daemon lintRelease

      - name: Decode PKCS12 release keystore
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"; exit 1
          fi
          KS="$RUNNER_TEMP/release.p12"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KS"
          echo "ANDROID_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Verify APK signature (apksigner)
        if: github.event_name != 'pull_request'
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"
          APK=app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-certs.txt
          if grep -q "CN=Android Debug" apk-certs.txt; then
            echo "::error::APK is signed with the Android debug certificate"; exit 1
          fi
          grep -q "Signer #1 certificate DN" apk-certs.txt

      - name: Verify AAB signature (jarsigner) and expected signer
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          # -strict turns signature problems into a non-zero exit. A self-signed upload certificate
          # produces a "not validated" chain warning, which is expected for Play upload keys.
          jarsigner -verify -verbose:summary -certs "$AAB" > aab-verify.txt 2>&1 || { cat aab-verify.txt; exit 1; }
          grep -q "jar verified" aab-verify.txt || { cat aab-verify.txt; echo "::error::AAB signature invalid"; exit 1; }
          if grep -q "CN=Android Debug" aab-verify.txt; then
            echo "::error::AAB is signed with the Android debug certificate"; exit 1
          fi
          EXPECTED=$(keytool -list -v -storetype PKCS12 -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" | sed -n 's/.*SHA256: //p' | head -1 | tr -d ': ')
          ACTUAL=$(unzip -p "$AAB" 'META-INF/*.RSA' 'META-INF/*.EC' 'META-INF/*.DSA' 2>/dev/null \
            | keytool -printcert | sed -n 's/.*SHA256: //p' | head -1 | tr -d ': ')
          echo "Expected signer SHA-256: $EXPECTED"
          echo "Actual signer SHA-256:   $ACTUAL"
          [ -n "$EXPECTED" ] && [ "$EXPECTED" = "$ACTUAL" ] || { echo "::error::AAB signer does not match the release keystore"; exit 1; }

      - name: Check release permissions
        if: github.event_name != 'pull_request'
        run: |
          chmod +x scripts/check_permissions.sh
          scripts/check_permissions.sh app/build/outputs/apk/release/app-release.apk \
            app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml

      - name: Check 16 KB native-library alignment (APK and AAB)
        if: github.event_name != 'pull_request'
        run: |
          python3 scripts/check_elf_alignment.py \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/bundle/release/app-release.aab
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/zipalign" -c -P 16 -v 4 \
            app/build/outputs/apk/release/app-release.apk | tail -n 5

      - name: Upload verified artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: timestablequest-release-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
            app/schemas/
          if-no-files-found: ignore

      - name: Remove temporary signing material
        if: always()
        run: |
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ] && [ -f "$ANDROID_KEYSTORE_PATH" ]; then
            shred -u "$ANDROID_KEYSTORE_PATH" 2>/dev/null || rm -f "$ANDROID_KEYSTORE_PATH"
          fi
